[project]
name = "paf-core"
version = "0.2.0"
description = "AstroTerra - scientific core (topographic analog assessment, not proof of geological equivalence)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyproj>=3.6",
    "rasterio>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/paf_core", "api/paf_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
